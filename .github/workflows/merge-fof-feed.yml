name: Merge FOF Product Feeds

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '30 */4 * * *'

permissions:
  contents: write

concurrency:
  group: merge-fof-feed
  cancel-in-progress: true

jobs:
  build-feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run feed merge script
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: node merge-fof-feeds.js

      - name: Upload merged feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: fof-alle-skoler-feed
          path: fof-alle-skoler-feed.xml

      - name: Commit and push updated feed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fof-alle-skoler-feed.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: update merged FOF feed"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -s "https://purge.jsdelivr.net/gh/PelleDahl/FOF-Meta-feed@main/fof-alle-skoler-feed.xml"
